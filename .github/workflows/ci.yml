on:
  push:
  workflow_dispatch:

jobs:
  build-builder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ipa_builder
          push: false
          load: true
          tags: ipa_builder:latest
      - name: build ipa agent
        run: |
          ./run_build.sh ${{ matrix.arch }}
      - name: upload built images
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa-debian12-2023.1-chi-${{ matrix.arch }}
          compression-level: 0 # initramfs is already compressed
          if-no-files-found: error
          path: |
            output/ipa-debian12-2023.1-chi-${{ matrix.arch }}.d/dib-manifests/
            output/ipa-debian12-2023.1-chi-${{ matrix.arch }}.initramfs
            output/ipa-debian12-2023.1-chi-${{ matrix.arch }}.kernel
      - name: Output artifact info
        run:  echo 'Artifact info is ${{ steps.artifact-upload.outputs }}'
